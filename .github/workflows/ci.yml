name: CI

# Trigger: mọi Pull Request + push lên main
on:
  pull_request:
  push:
    branches: [main]

# Hủy run cũ khi có commit mới trên cùng ref
concurrency:
  group: ci-be-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-be:
    name: Lint & Test (Backend)
    runs-on: ubuntu-latest

    # MySQL service container cho Jest (Prisma provider = mysql)
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: car_rent_test
          MYSQL_USER: carrent
          MYSQL_PASSWORD: carrent
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      DATABASE_URL: 'mysql://carrent:carrent@127.0.0.1:3306/car_rent_test'
      REDIS_URL: 'redis://localhost:6379'
      JWT_ACCESS_SECRET: 'ci-access-secret'
      JWT_REFRESH_SECRET: 'ci-refresh-secret'
      BCRYPT_SALT_ROUNDS: '4'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Prisma generate
        run: npx prisma generate

      - name: Wait for MySQL & apply schema
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: 'mysql://carrent:carrent@127.0.0.1:3306/car_rent_test'

      - name: Run tests (Jest)
        run: npm run test:ci
